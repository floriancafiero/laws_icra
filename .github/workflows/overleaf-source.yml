name: Overleaf source bundle

on:
  push:
    branches: [main]
    paths:
      - "paper/**"
      - "results/figures/icra/**"
      - ".github/workflows/overleaf-source.yml"
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install evaluation dependencies
        run: pip install -r requirements.txt

      - name: Regenerate submission figures
        run: python src/icra_evaluation.py

      - name: Fetch official PaperPlaza ieeeconf class
        run: |
          curl -fsSL https://ras.papercept.net/conferences/support/files/ieeeconf.zip -o /tmp/ieeeconf.zip
          mkdir -p /tmp/ieeeconf
          unzip -j -o /tmp/ieeeconf.zip '*ieeeconf.cls' -d /tmp/ieeeconf
          test -f /tmp/ieeeconf/ieeeconf.cls

      - name: Verify generated figure fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          for f in results/figures/icra/*.pdf; do
            if pdffonts "$f" | grep -q "Type 3"; then
              echo "PaperPlaza compliance failure: Type 3 font found in $f."
              pdffonts "$f"
              exit 1
            fi
          done

      - name: Assemble self-contained Overleaf project
        run: |
          rm -rf overleaf_bundle
          mkdir -p overleaf_bundle/figures
          cp paper/main.tex overleaf_bundle/main.tex
          cp paper/references.bib overleaf_bundle/references.bib
          cp /tmp/ieeeconf/ieeeconf.cls overleaf_bundle/ieeeconf.cls
          cp results/figures/icra/*.pdf overleaf_bundle/figures/
          cd overleaf_bundle
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path(".")
          with ZipFile("../laws_icra_final_overleaf.zip", "w", ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.as_posix())
          PY

      - name: Upload Overleaf bundle
        uses: actions/upload-artifact@v4
        with:
          name: icra-overleaf-source
          path: laws_icra_final_overleaf.zip
