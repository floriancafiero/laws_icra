name: ICRA evaluation

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: icra-evaluation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Theory sanity checks
        run: python -m unittest tests/test_theory.py

      - name: Generate ICRA evaluation
        run: python src/icra_evaluation.py

      - name: Commit generated figures and tables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/figures/icra/ results/tables/icra/
          if git diff --cached --quiet; then
            echo "Generated outputs already up to date."
          else
            git commit -m "Version generated ICRA figures and tables [skip ci]"
            git push
          fi

      - name: Upload generated evaluation
        uses: actions/upload-artifact@v4
        with:
          name: icra-evaluation
          path: |
            results/figures/icra/
            results/tables/icra/

      - name: Install LaTeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-publishers poppler-utils unzip curl

      - name: Fetch official PaperPlaza ieeeconf class
        run: |
          curl -fsSL https://ras.papercept.net/conferences/support/files/ieeeconf.zip -o /tmp/ieeeconf.zip
          unzip -j -o /tmp/ieeeconf.zip '*ieeeconf.cls' -d paper
          test -f paper/ieeeconf.cls

      - name: Compile ICRA manuscript
        run: |
          cd paper
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          PAGES=$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')
          echo "ICRA manuscript pages: $PAGES"
          test "$PAGES" -le 8

      - name: Upload compiled manuscript
        uses: actions/upload-artifact@v4
        with:
          name: icra-manuscript
          path: paper/main.pdf
